name: Build desktop toolbox
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf fonts-noto-cjk
      - run: npm ci
      - run: npm run check
      - name: Install browser for integration tests
        if: runner.os != 'Windows'
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: little-toolbox-${{ runner.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
